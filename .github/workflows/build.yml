name: Build IPA for Feather

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown in Feather"
        required: false
        default: "GitHub Actions build."
  push:
    branches:
      - full-project
      - main
    paths-ignore:
      - "build/Noir.ipa"
      - "repo.json"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: feather-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build iOS IPA and publish to main
    runs-on: macos-15
    steps:
      - name: Checkout full project source
        uses: actions/checkout@v4
        with:
          ref: full-project
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Noir.xcodeproj -scheme Noir

      - name: Build iOS IPA
        run: |
          chmod +x ./ipabuild.sh
          ./ipabuild.sh ios

      - name: Update Feather repo.json
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || format('GitHub Actions build ({0}).', github.sha) }}
        run: |
          python3 release_esign.py \
            --align-ipa-version \
            --description "$RELEASE_NOTES"

      - name: Stage release artifacts
        run: |
          mkdir -p /tmp/noir-ci-release
          cp build/Noir.ipa /tmp/noir-ci-release/Noir.ipa
          cp repo.json /tmp/noir-ci-release/repo.json

      - name: Checkout main for Feather release
        uses: actions/checkout@v4
        with:
          ref: main
          path: release-main
          fetch-depth: 0

      - name: Checkout full-project for artifact sync
        if: github.ref_name == 'full-project'
        uses: actions/checkout@v4
        with:
          ref: full-project
          path: release-full-project
          fetch-depth: 0

      - name: Publish IPA to main (Feather source branch)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_in_dir() {
            local dir="$1"
            local branch="$2"
            mkdir -p "$dir/build"
            cp /tmp/noir-ci-release/Noir.ipa "$dir/build/Noir.ipa"
            cp /tmp/noir-ci-release/repo.json "$dir/repo.json"
            cd "$dir"
            git add -f build/Noir.ipa repo.json
            if git diff --staged --quiet; then
              echo "No release changes for $branch"
              return 0
            fi
            git commit -m "CI: publish Noir.ipa for Feather [skip ci]"
            git push origin HEAD:"$branch"
          }

          publish_in_dir "$GITHUB_WORKSPACE/release-main" main

          if [ "${{ github.ref_name }}" = "full-project" ]; then
            publish_in_dir "$GITHUB_WORKSPACE/release-full-project" full-project
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noir-iOS
          path: build/Noir.ipa
          if-no-files-found: error
